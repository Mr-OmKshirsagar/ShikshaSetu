<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="arcGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Top decorative arc -->
  <path d="M 40 30 Q 100 10, 160 30" stroke="url(#arcGradient)" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Circle background -->
  <circle cx="100" cy="80" r="55" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Left person -->
  <circle cx="70" cy="80" r="7" fill="#1e40af"/>
  <path d="M 62 88 Q 70 84, 78 88 L 82 105 L 58 105 Z" fill="#1e40af"/>
  
  <!-- Center person head -->
  <circle cx="100" cy="68" r="9" fill="#1e40af"/>
  
  <!-- Right person -->
  <circle cx="130" cy="80" r="7" fill="#1e40af"/>
  <path d="M 122 88 Q 130 84, 138 88 L 142 105 L 118 105 Z" fill="#1e40af"/>
  
  <!-- Book leaves -->
  <path d="M 85 85 Q 82 77, 85 70 Q 88 75, 88 83 Z" fill="#2563eb"/>
  <path d="M 115 85 Q 118 77, 115 70 Q 112 75, 112 83 Z" fill="#14b8a6"/>
  
  <!-- Open book -->
  <path d="M 80 95 L 80 110 Q 100 106, 120 110 L 120 95 Q 100 99, 80 95 Z" fill="#1e40af" opacity="0.3"/>
  <line x1="100" y1="95" x2="100" y2="110" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Bridge base -->
  <rect x="20" y="140" width="160" height="40" fill="#1e40af" rx="4"/>
  
  <!-- Center capitol dome -->
  <circle cx="100" cy="155" r="15" fill="white" stroke="#1e40af" stroke-width="1.5"/>
  <rect x="85" y="160" width="30" height="20" fill="white" stroke="#1e40af" stroke-width="1"/>
  <!-- Flag -->
  <line x1="100" y1="140" x2="100" y2="130" stroke="#1e40af" stroke-width="1.5"/>
  <path d="M 100 130 L 108 133 L 100 136 Z" fill="#ef4444"/>
  
  <!-- Arches -->
  <circle cx="50" cy="165" r="18" fill="white"/>
  <circle cx="150" cy="165" r="18" fill="white"/>
</svg>

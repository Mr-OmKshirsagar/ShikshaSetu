<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#123057" />
    
    <!-- DNS Prefetch & Preconnect for faster resource loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preconnect to API backend for faster API calls -->
    <link rel="preconnect" href="/api" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/shikshasetu-square.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/shikshasetu-symbol-square.png" />
    
    <!-- SEO -->
    <meta name="description" content="ShikshaSetu — AI-powered competency intelligence and personalized learning for government employees." />
    <title>ShikshaSetu · Capability Intelligence</title>
    
    <!-- Preload critical assets -->
    <link rel="modulepreload" href="/src/main.tsx" />
    
    <!-- Early render optimization -->
    <style>
      /* Critical CSS for initial render - prevents FOUC */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        background-color: #eef4f8;
      }
      /* Loading spinner inline to show immediately */
      .init-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eef4f8;
        z-index: 9999;
      }
      .init-loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #dfe7f0;
        border-top-color: #123057;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Initial loading indicator (removed by React on mount) -->
    <div id="root">
      <div class="init-loader">
        <div class="init-loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
